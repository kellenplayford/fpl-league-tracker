name: Collect FPL snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = verify only; official = save today; backfill = save previous UK day"
        required: true
        default: test
        type: choice
        options: [test, official, backfill]

  schedule:
    # Three overnight chances. The first successful run saves the previous UK day.
    # Later runs become harmless no-ops if that date already exists.
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="scheduled"
          else
            MODE="${{ github.event.inputs.mode }}"
          fi
          python scripts/collect_fpl.py --mode "$MODE"

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes to commit. This is expected for backup scheduled runs when the snapshot already exists."
            exit 0
          fi
          git config user.name "fpl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Update FPL snapshot"
          git push
