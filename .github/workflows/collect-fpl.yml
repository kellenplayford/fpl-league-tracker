name: Collect FPL snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test does not alter official history; official saves a dated snapshot"
        required: true
        default: test
        type: choice
        options:
          - test
          - official

  schedule:
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="official"; fi
          python scripts/collect_fpl.py --mode "$MODE"

      - name: Commit updated data
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "fpl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Update FPL snapshot"
          git push
