name: FPL 1pm test snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  test_snapshot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.run_started_at >= '2026-08-25T12:00:00Z' && github.run_started_at < '2026-08-25T13:00:00Z')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect and save snapshot
        run: python scripts/collect_fpl.py --mode official
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "fpl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "1pm FPL test snapshot"
          git push
